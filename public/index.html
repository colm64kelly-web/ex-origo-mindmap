<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A18" />
    <meta
      name="description"
      content="EX ORIGO — interactive novel and transmedia architecture mindmap"
    />
    <!--
      Defense-in-depth: these meta tags reinforce the HTTP-level
      Cache-Control headers set in netlify.toml. HTTP headers are the
      authoritative source (meta tags are a weaker, older mechanism and
      some browsers ignore them for cached navigations), but having both
      means a misconfigured or bypassed CDN header is not the only thing
      standing between a visitor and stale content.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>EX ORIGO — Mindmap</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
